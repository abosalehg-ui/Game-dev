name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # فحص الأنواع على كامل المشروع (TS + Svelte)
      - name: Type check
        run: npm run check

      # اختبارات الوحدة: اشتقاق الموضوع، معادلات المحاكاة، سلامة الحفظ
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # نسخة الملف الواحد المستخدمة للتجربة على الجوال يجب أن تبقى قابلة للبناء
      - name: Build (single-file)
        run: npm run build:single

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
