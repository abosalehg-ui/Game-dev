name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Fast syntax gate — parses the inline game script and the service worker.
      - name: Syntax check
        run: npm run check

      # 2) Browser smoke test — boots the game and drives one full develop loop.
      # `npm ci` rather than `npm install`: the lockfile is committed now, so CI
      # resolves the exact tree the change was validated against. Without it every
      # run re-resolved playwright's dependency graph from the network, which made
      # a red build ambiguous (your change, or a transitive release?) and left the
      # job installing whatever the registry served that minute.
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test (boots the game, drives a full develop loop)
        run: npm run test:smoke

      # The topic is derived from the game's name now, so the derivation is game
      # logic: this pins the Arabic matching rules and the manual-override /
      # sequel-lock flows built on top of them.
      - name: Topic derivation suite
        run: npm run test:topic

      # Pins the save/import regressions: the start-screen reload that used to wipe
      # progress, the reset that used to resurrect it, and the hostile save files
      # that used to execute script or freeze the panel.
      - name: Save integrity suite
        run: npm run test:save

      # Asserts employees route around furniture on all six stage layouts instead of
      # walking through it, and that every seat can still reach the coffee corner.
      - name: Pathfinding suite
        run: npm run test:path

      # Asserts the whole floor is on screen on every viewport shape, at every
      # orbit angle. The orthographic frustum used to pin its half-height and
      # derive the width from the aspect, which showed a portrait phone a third of
      # the skyscraper — and got worse the further the player progressed.
      - name: Viewport fit suite
        run: npm run test:fit

      # Asserts every world event quotes the number it actually applies. Four of
      # them used to carry hand-written figures that had drifted from the shared
      # BALANCE constant behind their `type`.
      - name: Event text suite
        run: npm run test:events

      # Asserts an open modal actually holds focus. Every overlay claimed
      # aria-modal="true" while letting Tab walk out onto the page behind it.
      - name: Focus containment suite
        run: npm run test:focus

      # The skyscraper used to be the end of the content rather than the end of the
      # game. This pins the finish line: the streak must count consecutive years,
      # the ending must need the top stage too, and it must fire exactly once.
      - name: Endgame suite
        run: npm run test:endgame

      # Calls the real computeScore/computeSales/getDevCost inside the running game
      # and pins the properties the balance rests on: a continuous score curve,
      # scores in [1,10], revenue rising with the review, a fan multiplier with a
      # knee, and the constants the balance sim parses being the ones the game uses.
      - name: Formula suite
        run: npm run test:formulas

      # Taking the rescue loan used to resume the post-release pipeline twice
      # (stacked modals, double event rolls). Pins exactly one resumption.
      - name: Rescue loan suite
        run: npm run test:rescue

      # Walks ~26 consecutive releases through the post-release pipeline, which a
      # one-release smoke test cannot cover: a mis-ordered flow step only shows up
      # as a dead end after a year rollover or an award ceremony.
      - name: Long-run playthrough
        run: npm run test:play

      # Reports pacing from the stage table it parses out of index.html. Not a gate,
      # but the numbers land in the build log next to the diff that changed them.
      - name: Balance simulation (informational)
        run: npm run balance

      # 3) Guard: the service worker VERSION must be bumped whenever index.html
      #    changes, or returning players stay stuck on a stale cached build.
      - name: Service worker version bump check
        if: github.event_name == 'pull_request'
        run: node tools/check-sw-version.mjs origin/${{ github.base_ref }}
